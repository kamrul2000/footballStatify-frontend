<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{isEditMode ? 'Edit Player' : 'Add Player'}}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter player name">
          <mat-error *ngIf="form.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Position</mat-label>
          <mat-select formControlName="position">
            <mat-option value="Goalkeeper">Goalkeeper</mat-option>
            <mat-option value="Defender">Defender</mat-option>
            <mat-option value="Midfielder">Midfielder</mat-option>
            <mat-option value="Forward">Forward</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('position')?.hasError('required')">
            Position is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Jersey Number</mat-label>
          <input matInput type="number" formControlName="jerseyNumber" min="1" max="99">
          <mat-error *ngIf="form.get('jerseyNumber')?.hasError('required')">
            Jersey number is required
          </mat-error>
          <mat-error *ngIf="form.get('jerseyNumber')?.hasError('min') || form.get('jerseyNumber')?.hasError('max')">
            Jersey number must be between 1 and 99
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Team</mat-label>
          <mat-select formControlName="teamId">
            <mat-option value="">Select Team</mat-option>
            <mat-option *ngFor="let t of teams" [value]="t.id">{{ t.teamName }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('teamId')?.hasError('required')">
            Team is required
          </mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button type="button" (click)="cancel()">
            Cancel
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid">
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            <span *ngIf="!loading">{{ isEditMode ? 'Update Player' : 'Add Player' }}</span>
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
