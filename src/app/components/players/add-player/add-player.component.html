<div class="container py-3">
  <h2>Add Player</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="mb-3">
      <label>Name</label>
      <input type="text" class="form-control" formControlName="name">
    </div>

    <div class="mb-3">
      <label>Position</label>
      <input type="text" class="form-control" formControlName="position">
    </div>

    <div class="mb-3">
      <label>Age</label>
      <input type="number" class="form-control" formControlName="age">
    </div>

    <div class="mb-3">
      <label>Team</label>
      <select class="form-control" formControlName="teamId">
        <option value="">Select Team</option>
        <option *ngFor="let t of teams" [value]="t.id">{{ t.name }}</option>
      </select>
    </div>

    <button class="btn btn-success" [disabled]="loading || form.invalid">
      {{ loading ? 'Saving...' : 'Add Player' }}
    </button>

  </form>
</div>
