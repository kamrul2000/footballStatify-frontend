<div class="container py-3">
  <h2>Teams</h2>
  <a routerLink="/teams/create" class="btn btn-primary mb-3">Add Team</a>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="text-danger">{{ error }}</div>

  <table class="table table-striped" *ngIf="teams.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Coach</th>
        <th>Players</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams">
        <td>{{ team.name }}</td>
        <td>{{ team.coach }}</td>
        <td>{{ team.players }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="delete(team.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
