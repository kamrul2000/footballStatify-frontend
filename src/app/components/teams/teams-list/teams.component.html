<div class="container">
  <div class="header">
    <h2>Teams</h2>
    <button mat-raised-button color="primary" routerLink="/teams/create">
      <mat-icon>add</mat-icon> Add Team
    </button>
  </div>

  <!-- Search Bar -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search teams</mat-label>
    <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Search by name or coach...">
    <mat-icon matPrefix>search</mat-icon>
    <button mat-icon-button matSuffix *ngIf="searchTerm" (click)="searchTerm=''; applyFilter()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <div *ngIf="isLoading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" class="error">
    <p>{{error}}</p>
  </div>

  <div *ngIf="!isLoading && !error && filteredTeams.length === 0 && !searchTerm" class="no-data">
    <p>No teams found. Create your first team!</p>
  </div>

  <div *ngIf="!isLoading && !error && filteredTeams.length === 0 && searchTerm" class="no-data">
    <p>No teams found matching "{{searchTerm}}"</p>
  </div>

  <table mat-table [dataSource]="filteredTeams" *ngIf="!isLoading && !error && filteredTeams.length > 0" class="mat-elevation-z8">
    
    <!-- Serial Number Column -->
    <ng-container matColumnDef="serialNo">
      <th mat-header-cell *matHeaderCellDef> # </th>
      <td mat-cell *matCellDef="let team; let i = index"> {{i + 1}} </td>
    </ng-container>

    <!-- Team Name Column -->
    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef> Team Name </th>
      <td mat-cell *matCellDef="let team"> 
        <div class="team-cell">
          <mat-icon>groups</mat-icon>
          {{team.name}}
        </div>
      </td>
    </ng-container>

    <!-- Coach Column -->
    <ng-container matColumnDef="coach">
      <th mat-header-cell *matHeaderCellDef> Coach </th>
      <td mat-cell *matCellDef="let team"> 
        <div class="coach-cell">
          <mat-icon>sports</mat-icon>
          {{team.coach}}
        </div>
      </td>
    </ng-container>

    <!-- Founded Year Column -->
    <ng-container matColumnDef="foundingYear">
      <th mat-header-cell *matHeaderCellDef> Founded Year </th>
      <td mat-cell *matCellDef="let team"> 
        <span class="year-badge">{{team.foundingYear}}</span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let team">
        <button mat-icon-button color="primary" [routerLink]="['/teams', team.id]" matTooltip="View Details">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="accent" [routerLink]="['/teams/edit', team.id]" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTeam(team)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
