<!-- Header -->
<mat-card class="fixed-card" fxLayout="row" fxLayoutAlign="space-between center">
  <div class="primary-header">Teams</div>
  <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
    <button mat-raised-button color="primary" (click)="addTeam()">
      <mat-icon>add</mat-icon> Add New
    </button>
  </div>
</mat-card>

<!-- Teams Table -->
<mat-card>
  <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>
  
  <!-- Search Field -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Teams</mat-label>
    <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Search by team name or coach...">
    <mat-icon matPrefix>search</mat-icon>
    <button mat-icon-button matSuffix *ngIf="searchTerm" (click)="searchTerm=''; applyFilter()">
      <mat-icon>clear</mat-icon>
    </button>
  </mat-form-field>
  
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-100">

    <!-- Serial Number -->
    <ng-container matColumnDef="serialNo">
      <th mat-header-cell *matHeaderCellDef>SL#</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Team Name -->
    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef>Team Name</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <!-- Coach -->
    <ng-container matColumnDef="coach">
      <th mat-header-cell *matHeaderCellDef>Coach</th>
      <td mat-cell *matCellDef="let element">{{ element.coach }}</td>
    </ng-container>

    <!-- Founded Year -->
    <ng-container matColumnDef="foundingYear">
      <th mat-header-cell *matHeaderCellDef>Founded Year</th>
      <td mat-cell *matCellDef="let element">{{ element.foundingYear }}</td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="viewTeam(row)">
          <mat-icon>remove_red_eye</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="editTeam(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTeam(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
