<mat-toolbar color="primary" class="app-toolbar">
  <mat-toolbar-row>
    <span class="app-title">
      <mat-icon>sports_soccer</mat-icon>
      Football Manager
    </span>
    <span class="spacer"></span>
    <nav class="nav-menu">
      <a mat-button *ngFor="let item of menuItems" [routerLink]="item.path" routerLinkActive="active-link">
        <mat-icon>{{item.icon}}</mat-icon>
        {{item.label}}
      </a>
    </nav>
  </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of menuItems" [routerLink]="item.path" routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
