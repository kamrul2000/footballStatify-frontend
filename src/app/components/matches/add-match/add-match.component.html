<div class="container mt-3">
  <h2>Add Match</h2>

  <form [formGroup]="matchForm" (ngSubmit)="onSubmit()">

    <div class="form-group mb-3">
      <label>Team A ID</label>
      <input type="number" class="form-control" formControlName="teamAId">
    </div>

    <div class="form-group mb-3">
      <label>Team B ID</label>
      <input type="number" class="form-control" formControlName="teamBId">
    </div>

    <div class="form-group mb-3">
      <label>Match Date</label>
      <input type="date" class="form-control" formControlName="matchDate">
    </div>

    <div class="form-group mb-3">
      <label>Venue</label>
      <input type="text" class="form-control" formControlName="venue">
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="matchForm.invalid">
      Add Match
    </button>

  </form>
</div>
