<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Match Result' : 'Add Match Result' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="resultForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Match</mat-label>
          <mat-select formControlName="matchId">
            <mat-option *ngFor="let match of matches" [value]="match.id">
              Match #{{match.id}} - {{match.venue}} ({{match.matchDate | date: 'short'}})
            </mat-option>
          </mat-select>
          <mat-error *ngIf="resultForm.get('matchId')?.hasError('required')">
            Match is required
          </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Team A Goals</mat-label>
          <input matInput type="number" formControlName="teamAGoals" min="0">
          <mat-error *ngIf="resultForm.get('teamAGoals')?.hasError('required')">
            Team A goals are required
          </mat-error>
          <mat-error *ngIf="resultForm.get('teamAGoals')?.hasError('min')">
            Goals cannot be negative
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Team B Goals</mat-label>
          <input matInput type="number" formControlName="teamBGoals" min="0">
          <mat-error *ngIf="resultForm.get('teamBGoals')?.hasError('required')">
            Team B goals are required
          </mat-error>
          <mat-error *ngIf="resultForm.get('teamBGoals')?.hasError('min')">
            Goals cannot be negative
          </mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button type="button" (click)="cancel()">
            Cancel
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="resultForm.invalid || isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
            <span *ngIf="!isLoading">{{ isEditMode ? 'Update Result' : 'Add Result' }}</span>
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
