<div class="container">
  <div class="header">
    <h2>Match Results</h2>
    <button mat-raised-button color="primary" (click)="addResult()">
      <mat-icon>add</mat-icon> Add Result
    </button>
  </div>

  <div *ngIf="isLoading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && matchResults.length === 0" class="no-data">
    <p>No match results found. Add your first result!</p>
  </div>

  <div *ngIf="!isLoading && matchResults.length > 0">
    <!-- Search Field -->
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Results</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Search by match ID or result...">
      <mat-icon matPrefix>search</mat-icon>
      <button mat-icon-button matSuffix *ngIf="searchTerm" (click)="searchTerm=''; applyFilter()">
        <mat-icon>clear</mat-icon>
      </button>
    </mat-form-field>

    <table mat-table [dataSource]="filteredMatchResults" class="mat-elevation-z8">
    
    <!-- Serial Number Column -->
    <ng-container matColumnDef="serialNo">
      <th mat-header-cell *matHeaderCellDef> # </th>
      <td mat-cell *matCellDef="let result; let i = index"> {{i + 1}} </td>
    </ng-container>

    <!-- Match Column -->
    <ng-container matColumnDef="match">
      <th mat-header-cell *matHeaderCellDef> Match </th>
      <td mat-cell *matCellDef="let result"> Match #{{result.matchId}} </td>
    </ng-container>

    <!-- Home Score Column -->
    <ng-container matColumnDef="homeScore">
      <th mat-header-cell *matHeaderCellDef> Home Score </th>
      <td mat-cell *matCellDef="let result"> {{result.homeScore}} </td>
    </ng-container>

    <!-- Away Score Column -->
    <ng-container matColumnDef="awayScore">
      <th mat-header-cell *matHeaderCellDef> Away Score </th>
      <td mat-cell *matCellDef="let result"> {{result.awayScore}} </td>
    </ng-container>

    <!-- Winner Column -->
    <ng-container matColumnDef="winner">
      <th mat-header-cell *matHeaderCellDef> Result </th>
      <td mat-cell *matCellDef="let result"> 
        <span [class.win]="result.homeScore > result.awayScore" 
              [class.loss]="result.awayScore > result.homeScore"
              [class.draw]="result.homeScore === result.awayScore">
          {{getWinnerText(result)}}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let result">
        <button mat-icon-button color="primary" (click)="viewResult(result)" matTooltip="View Details">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="editResult(result)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteResult(result)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  </div>
</div>
